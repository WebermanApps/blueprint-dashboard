<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blueprint Command Center</title><meta name="description" content="Blueprint dream home agent dashboard"><meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="model.jpg">
<style>
:root{--ink:#0a0a0a;--pri:#171717;--mute:#737373;--line:#e5e5e5;--bg:#fafafa;--card:#fff;--soft:#f5f5f5;--cream:#FBF8F2;--sel:#F3EDE2;--sage:#6b8f71;--amber:#b7791f;--ease:cubic-bezier(.2,.8,.2,1);--dur:180ms;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 Hind,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3,.tile b,.t{font-family:Khand,Arial,sans-serif;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
a{color:var(--ink)}
/* report bar */
.rep{background:var(--sel);border-bottom:1px solid var(--line)}
.rep button{all:unset;box-sizing:border-box;width:100%;min-height:44px;display:flex;align-items:center;gap:10px;cursor:pointer}
.rep .lab{font:700 11px Hind;letter-spacing:.14em;text-transform:uppercase}.rep .sum{flex:1;font-size:14px;color:#525252;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{width:9px;height:9px;border-right:2px solid var(--pri);border-bottom:2px solid var(--pri);transform:rotate(45deg) translateY(-3px);transition:transform .25s var(--ease);flex:none;margin-right:4px}
.open .ch{transform:rotate(225deg) translateY(-1px)}
.rep .ab,.acc .ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}.open>.ab,.rep.open .ab{grid-template-rows:1fr}
.ab>div{overflow:hidden}.rep ul{margin:0;padding:0 0 12px 18px;font-size:15px}.rep li{margin:3px 0}.rep li.rc{list-style:none;margin:10px 0 2px -18px;font:700 11px Hind;letter-spacing:.14em;text-transform:uppercase}
/* header */
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:52px}
.wm{font:700 18px Hind;text-transform:uppercase;letter-spacing:-.3px;flex:1}.wm small{font-weight:400;color:var(--mute);letter-spacing:.12em;font-size:11px;margin-left:8px}
.sbtn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:2px solid var(--pri);color:var(--pri);font:700 12px Hind;letter-spacing:.12em;text-transform:uppercase;padding:0 14px;border-radius:0;cursor:pointer;text-decoration:none}
.sbtn:hover{background:var(--pri);color:#fafafa}
/* hero */
.hero{background:var(--cream);border-bottom:1px solid var(--line);padding:18px 0 22px}
.brand{font:700 11px Hind;letter-spacing:.2em;text-transform:uppercase;color:#525252}
.hero h1{font-size:40px;letter-spacing:-1px;line-height:1;margin:6px 0 0}
.rule{width:36px;height:1px;background:var(--ink);margin:12px 0 10px}
.hero p{margin:0;color:#525252;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{border:1px solid #d4d4d4;background:#fff;font:700 11px Hind;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px}
.mcard{display:block;margin-top:14px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line)}
.mcard .img{position:relative;aspect-ratio:900/398;background:#e9e4d8 url(model.jpg) center/cover;overflow:hidden}
.mcard .tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);font:700 10px Hind;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:2px solid var(--pri);background:#fff;color:var(--pri);font:700 14px Hind;letter-spacing:.14em;text-transform:uppercase;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.mcard:hover .go{background:var(--pri);color:#fafafa}.go svg{width:20px;height:20px}
.go .arr{transition:transform var(--dur) var(--ease)}.mcard:hover .arr{transform:translateX(3px)}
/* sections */
h3.grp{font:700 12px Hind;letter-spacing:.16em;text-transform:uppercase;margin:28px 0 10px;display:flex;align-items:center;gap:8px;scroll-margin-top:70px}
.n{font:700 11px Hind;background:var(--sel);border:1px solid var(--pri);padding:0 7px;letter-spacing:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:116px}
.ic{width:38px;height:38px;background:var(--soft);display:grid;place-items:center;flex:none}.ic svg{width:22px;height:22px}
.tile b{font-size:19px;line-height:1.05;letter-spacing:-.2px}.tile span{font-size:13px;color:var(--mute);line-height:1.3}
.acc{background:#fff;border:1px solid var(--line);margin:0 0 -1px}
.acc>button{all:unset;box-sizing:border-box;width:100%;min-height:52px;display:grid;grid-template-columns:22px 1fr 18px;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.acc>button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.acc .at{font-weight:700;font-size:15px;line-height:1.25}.acc .ab>div{padding:0 14px 0 46px;color:#525252;font-size:15px}.acc.open .ab>div{padding-bottom:12px}
.acc svg.mk{width:20px;height:20px}
.row{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);margin:0 0 -1px;padding:12px 14px}
.row svg{width:20px;height:20px;flex:none;margin-top:2px}.row b{display:block;font-size:15px}.row span{font-size:14px;color:var(--mute)}
video{width:100%;display:block;background:#000;border:1px solid var(--line)}
.mw-hover{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.02);box-shadow:0 6px 18px rgba(10,10,10,.12)}.mw-hover:active{transform:scale(.98)}
.share{text-align:center;margin:32px 0 8px}.share .sbtn{padding:0 28px}#msg{color:var(--mute);font-size:14px;min-height:20px;margin-top:6px}
footer{text-align:center;padding:10px 16px 24px}.mw-built{font-size:14px;color:var(--mute)}.mw-built a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;border-bottom:1px solid rgba(10,10,10,.3)}
.upd{font-size:13px;color:var(--mute);text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;max-width:110px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#8a8a8a;font:700 10px Hind;letter-spacing:.08em;text-transform:uppercase}
nav.tabs.hide{display:none}nav.tabs a svg{width:22px;height:22px}nav.tabs a:hover,nav.tabs a.on{color:var(--ink)}nav.tabs a.on{box-shadow:inset 0 -2px 0 var(--pri)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.wrap{max-width:1180px;padding:0 32px}
 .hero{padding:32px 0}.hero .wrap{display:grid;grid-template-columns:5fr 7fr;gap:40px;align-items:center}.hero h1{font-size:56px}.mcard{margin-top:0}
 .cols{display:grid;grid-template-columns:3fr 2fr;gap:32px}.media{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}}
@media(min-width:1024px){.rep ul{columns:2;column-gap:48px}.rep li{break-inside:avoid}.rep li.rc{break-after:avoid}nav.tabs{display:none}body{padding-bottom:0}video{max-width:1100px;margin:0 auto}}
a:focus-visible,button:focus-visible{outline:3px solid #171717;outline-offset:3px}
@media(min-width:1600px){body{font-size:20px}.wrap{max-width:min(2200px,90vw);padding:0 0}
 .rep .lab{font-size:14px}.rep .sum,.rep ul{font-size:20px}.rep li.rc{font-size:14px}.rep button{min-height:56px}
 header.top .wrap{min-height:68px}.wm{font-size:24px}.wm small{font-size:14px}.sbtn{font-size:15px;min-height:52px;padding:0 20px}
 .hero{padding:56px 0}.hero h1{font-size:96px}.brand{font-size:14px}.hero p{font-size:24px}.chip{font-size:14px;padding:7px 14px}.rule{width:48px;margin:18px 0 14px}
 .go{min-height:68px;font-size:18px}.go svg{width:26px;height:26px}.mcard .tag{font-size:13px}
 h3.grp{font-size:16px;margin:48px 0 16px}.n{font-size:14px}
 .grid{grid-template-columns:repeat(3,1fr);gap:20px}.tile{min-height:200px;padding:28px;gap:14px}.ic{width:60px;height:60px}.ic svg{width:34px;height:34px}.tile b{font-size:32px}.tile span{font-size:20px}
 .cols{grid-template-columns:repeat(3,1fr);gap:40px}.cols>.side{display:contents}
 .acc>button{min-height:68px;grid-template-columns:28px 1fr 22px;padding:14px 20px}.acc svg.mk,.row svg{width:26px;height:26px}.acc .at,.row b{font-size:22px}.acc .ab>div{font-size:20px;padding-left:68px}.row{padding:16px 20px;gap:16px}.row span{font-size:20px}
 .share .sbtn{min-height:60px}#msg,.upd,.mw-built{font-size:18px}.mw-built a{min-height:52px}video{max-width:1400px}}
@media(min-width:2400px){.tile{min-height:220px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.mw-hover:hover{transform:none}}
.att{background:#fff;border-left:4px solid #b7791f}.att .ai{width:20px;height:20px;flex:none}.att li b{font-weight:700}.att .lv{font:700 11px Hind;letter-spacing:.12em;text-transform:uppercase;color:#8a5a12;margin-right:6px}
@media(min-width:1600px){.att .ai{width:26px;height:26px}.att .lv{font-size:14px}}
</style></head><body>
<div class="rep" id="rep" hidden><div class="wrap"><button aria-expanded="false" id="repb"><span class="lab" id="rlab"></span><span class="sum" id="rsum"></span><span class="ch"></span></button><div class="ab"><div><ul id="rlist"></ul></div></div></div></div>
<div class="rep att" id="att" hidden><div class="wrap"><button aria-expanded="false" id="attb"><svg class="ai" viewBox="0 0 24 24" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg><span class="lab">Needs Attention</span><span class="sum" id="asum"></span><span class="ch"></span></button><div class="ab"><div><ul id="alist"></ul></div></div></div></div>
<header class="top"><div class="wrap"><div class="wm">Blueprint<small>Dream Home</small></div><a class="sbtn mw-hover" id="h3d" href="https://webermanapps.github.io/weberman-residence/" target="_blank" rel="noopener">3D Model</a></div></header>
<section class="hero" id="home"><div class="wrap">
 <div><div class="brand" id="role">Dream Home Agent</div><h1 id="proj">Weberman Residence</h1><div class="rule"></div><p id="stat"></p><div class="chips" id="facts"></div></div>
 <a class="mcard mw-hover" id="mlink" href="https://webermanapps.github.io/weberman-residence/" target="_blank" rel="noopener"><div class="img" role="img" aria-label="3D model preview"><span class="tag">Interactive 3D</span></div>
 <div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>Open 3D Model<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></a>
</div></section>
<main class="wrap">
 <h3 class="grp" id="apps">Apps And Files</h3><div class="grid" id="links"></div>
 <div class="cols"><div><h3 class="grp" id="decide">Decisions For You <span class="n" id="dc"></span></h3><div id="decisions"></div></div>
 <div class="side"><div><h3 class="grp">Pending <span class="n" id="pc"></span></h3><div id="pending"></div></div><div><h3 class="grp" id="work">Recent Work</h3><div id="recent"></div></div></div></div>
 <h3 class="grp" id="vt">Water Systems</h3><video id="vid" controls preload="none" playsinline></video>
 <div class="share"><button class="sbtn mw-hover" data-share><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg>Share</button><div id="msg"></div></div>
 <p class="upd" id="upd"></p>
</main>
<footer><div class="mw-built"><a href="https://maxweberman.com" target="_blank" rel="noopener">Built by Max Weberman</a></div></footer>
<nav class="tabs"><a href="#home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-6h4v6"/></svg>Home</a>
<a id="t3d" href="https://webermanapps.github.io/weberman-residence/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>3D Model</a>
<a href="#decide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16v.5"/></svg>Decide</a>
<a href="#apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Apps</a>
<a href="#work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Work</a></nav>
<script>
const I={cube:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',swipe:'<rect x="6" y="3" width="12" height="16"/><path d="M2 21h20"/>',split:'<rect x="3" y="5" width="8" height="14"/><rect x="13" y="5" width="8" height="14"/>',doc:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h8"/>',q:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16v.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'};
const sv=(k,c,cl)=>`<svg ${cl?'class="'+cl+'"':''} viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]||I.doc}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tog=el=>{el.classList.toggle('open');el.querySelector('button').setAttribute('aria-expanded',el.classList.contains('open'))};
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
role.textContent=d.agent+' · '+d.role;proj.textContent=d.project;stat.textContent=d.status;upd.textContent='Updated '+d.updated;
facts.innerHTML=d.facts.map(f=>`<span class="chip">${esc(f)}</span>`).join('');
if(d.model){mlink.href=t3d.href=h3d.href=d.model.url;mlink.querySelector('.img').style.backgroundImage=`url(${d.model.image})`}
if(d.report&&d.report.items&&d.report.items.length){rep.hidden=false;rlab.textContent=d.report.type+' · '+new Date(d.report.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});const G=d.report.items.map(g=>typeof g=='string'?{cat:'',items:[g]}:g);rsum.textContent=G.reduce((n,g)=>n+g.items.length,0)+' Updates';rlist.innerHTML=G.map(g=>(g.cat?`<li class="rc">${esc(g.cat)}</li>`:'')+g.items.map(i=>`<li>${esc(i)}</li>`).join('')).join('');repb.onclick=()=>tog(rep)}
const A=d.attention||[];if(A.length){att.hidden=false;const c={};A.forEach(a=>c[a.level]=(c[a.level]||0)+1);asum.textContent=Object.entries(c).map(([k,n])=>n+' '+k+(n>1?'s':'')).join(' · ');alist.innerHTML=A.map(a=>`<li><span class="lv">${esc(a.level)}</span><b>${esc(a.title)}</b>: ${esc(a.note)}</li>`).join('');attb.onclick=()=>tog(att)}
links.innerHTML=d.links.map(l=>`<a class="tile mw-hover" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ic">${sv(l.icon,'#171717')}</span><b>${esc(l.title)}</b><span>${esc(l.note)}</span></a>`).join('');
decisions.innerHTML=d.decisions.map(x=>`<div class="acc"><button aria-expanded="false">${sv('q','#b7791f','mk')}<span class="at">${esc(x.title)}</span><span class="ch"></span></button><div class="ab"><div>${esc(x.note)}</div></div></div>`).join('');dc.textContent=d.decisions.length;
decisions.querySelectorAll('.acc').forEach(a=>a.querySelector('button').onclick=()=>tog(a));
const rows=(a,k,c)=>a.map(x=>`<div class="row">${sv(k,c)}<div><b>${esc(x.title)}</b><span>${esc(x.note)}</span></div></div>`).join('');
pending.innerHTML=rows(d.pending,'clock','#737373');pc.textContent=d.pending.length;recent.innerHTML=rows(d.recent,'check','#6b8f71');
vt.textContent=d.video.title;vid.src=d.video.src;vid.poster=d.video.poster;});
document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const u=location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:document.title,url:u});else{await navigator.clipboard.writeText(u);msg.textContent='Link Copied'}}catch(e){}});
const tabs=[...document.querySelectorAll('nav.tabs a[href^="#"]')];tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('on'));t.classList.add('on')}));
const nv=document.querySelector('nav.tabs'),shr=document.querySelector('.share');const nvf=()=>nv.classList.toggle('hide',shr.getBoundingClientRect().top<innerHeight-10);addEventListener('scroll',nvf,{passive:true});addEventListener('resize',nvf);nvf();
</script></body></html>
